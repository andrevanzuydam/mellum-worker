[project]
site_name = "Small AI Learning Center"
site_url = "https://pauleveritt.github.io/mellum-worker/"
site_description = "Small coding models, measured: problems, fixes, evidence."
repo_url = "https://github.com/pauleveritt/mellum-worker"
docs_dir = "learn"
site_dir = "site"
exclude_docs = "code/"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/badges.js"]
nav = [
  { "Home" = "index.md" },
  { "Introduction" = "introduction/index.md" },
  { "Getting started" = ["getting-started/index.md", "getting-started/base-pi-on-llamacpp.md", "getting-started/ditch.md",
    "getting-started/harness.md",
    "getting-started/suite.md", "getting-started/worker-extension.md",
    "getting-started/troubleshoot.md"] },
  { "Lessons" = [
    "lessons/index.md",
    { "Easy" = ["lessons/easy/index.md", "lessons/easy/baseline.md",
      "lessons/easy/write-only-listed.md", "lessons/easy/project-facts.md",
      "lessons/easy/short-prompt.md"] },
    { "Medium" = ["lessons/medium/index.md",
      "lessons/medium/thinking-working-memory.md",
      "lessons/medium/guards-for-empty-turns.md",
      "lessons/medium/one-spec-per-phase.md", "lessons/medium/prose-brief.md"] },
    { "Hard" = ["lessons/hard/index.md", "lessons/hard/primary-agent.md",
      "lessons/hard/intercom-block.md"] },
  ] },
  { "Pathologies" = "pathologies.md" },
  { "Glossary" = "glossary.md" },
  { "About" = [
    "about/index.md", "about/how-to-read.md",
    "about/evidence.md", "about/contributing.md",
    { "Project" = ["project/index.md", "project/toolchain.md"] },
    { "Lesson template" = "lesson-template.md" },
    "credits.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.markdown_extensions.zensical_glossary]
glossary_file = "glossary.md"
heading_level = 3
first_only = true
base_url = "/mellum-worker/glossary/"
