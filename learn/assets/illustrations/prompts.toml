# The Lessons illustrations: one shared style, one subject and seed per image.
# Regenerate with `uv run scripts/illustrate.py` (only missing images) or
# `uv run scripts/illustrate.py --force <name>`. The small robot is the model.

style = "flat vector illustration, muted teal and coral palette with soft grey, clean white background, simple rounded shapes, a small friendly teal robot as the main character, plenty of white space, no text, no letters, no numbers"
negative = "text, letters, words, numbers, watermark, logo, photo, realistic, gradient, clutter"
width = 1280
height = 640

