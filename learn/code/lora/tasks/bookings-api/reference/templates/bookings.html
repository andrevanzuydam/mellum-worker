{% extends "base.html" %}
{% block content %}
<h1>Bookings</h1>
<ul>
  {% for b in bookings %}
  <li>{{ b.who }} @ {{ b.when_at }}{% if b.confirmed %} (confirmed){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/bookings">
  <input name="who" placeholder="Name" />
  <input name="when_at" placeholder="2026-02-01T10:00" />
  <button type="submit">Book</button>
</form>
{% endblock %}
