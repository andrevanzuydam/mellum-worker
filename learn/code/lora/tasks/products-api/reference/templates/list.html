{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.name }} — {{ r.sku }}{% if r.featured %} (featured){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/products">
  <input name="name" />
  <input name="sku" />
  <button type="submit">Add</button>
</form>
{% endblock %}
