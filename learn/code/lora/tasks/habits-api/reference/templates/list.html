{% extends "base.html" %}
{% block content %}
<h1>Habits</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.name }} — {{ r.cadence }}{% if r.tracked %} (tracked){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/habits">
  <input name="name" />
  <input name="cadence" />
  <button type="submit">Add</button>
</form>
{% endblock %}
