{% extends "base.html" %}
{% block content %}
<h1>Contacts</h1>
<ul>
  {% for c in contacts %}
  <li>{{ c.name }} &lt;{{ c.email }}&gt;{% if c.starred %} (starred){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/contacts">
  <input name="name" placeholder="Name" />
  <input name="email" placeholder="name@example.com" />
  <button type="submit">Add</button>
</form>
{% endblock %}
