{% extends "base.html" %}
{% block content %}
<h1>Contacts</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.name }} — {{ r.email }}{% if r.starred %} (starred){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/contacts">
  <input name="name" />
  <input name="email" />
  <button type="submit">Add</button>
</form>
{% endblock %}
