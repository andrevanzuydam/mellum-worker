{% extends "base.html" %}
{% block content %}
<h1>Trips</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.place }} — {{ r.when_at }}{% if r.booked %} (booked){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/trips">
  <input name="place" />
  <input name="when_at" />
  <button type="submit">Add</button>
</form>
{% endblock %}
