{% extends "base.html" %}
{% block content %}
<h1>Recipes</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.title }} — {{ r.source }}{% if r.favorited %} (favorited){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/recipes">
  <input name="title" />
  <input name="source" />
  <button type="submit">Add</button>
</form>
{% endblock %}
