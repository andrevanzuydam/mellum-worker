{% extends "base.html" %}
{% block content %}
<h1>Projects</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.name }} — {{ r.lead }}{% if r.starred %} (starred){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/projects">
  <input name="name" />
  <input name="lead" />
  <button type="submit">Add</button>
</form>
{% endblock %}
