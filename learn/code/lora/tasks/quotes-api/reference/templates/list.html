{% extends "base.html" %}
{% block content %}
<h1>Quotes</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.body }} — {{ r.author }}{% if r.loved %} (loved){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/quotes">
  <input name="body" />
  <input name="author" />
  <button type="submit">Add</button>
</form>
{% endblock %}
