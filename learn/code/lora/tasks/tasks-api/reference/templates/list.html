{% extends "base.html" %}
{% block content %}
<h1>Tasks</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.title }} — {{ r.owner }}{% if r.starred %} (starred){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/tasks">
  <input name="title" />
  <input name="owner" />
  <button type="submit">Add</button>
</form>
{% endblock %}
