{% extends "base.html" %}
{% block content %}
<h1>Tracks</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.title }} — {{ r.artist }}{% if r.liked %} (liked){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/tracks">
  <input name="title" />
  <input name="artist" />
  <button type="submit">Add</button>
</form>
{% endblock %}
