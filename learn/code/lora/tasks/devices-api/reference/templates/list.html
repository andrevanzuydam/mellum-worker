{% extends "base.html" %}
{% block content %}
<h1>Devices</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.name }} — {{ r.kind }}{% if r.paired %} (paired){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/devices">
  <input name="name" />
  <input name="kind" />
  <button type="submit">Add</button>
</form>
{% endblock %}
