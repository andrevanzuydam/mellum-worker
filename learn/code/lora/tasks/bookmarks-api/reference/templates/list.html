{% extends "base.html" %}
{% block content %}
<h1>Bookmarks</h1>
<ul>
  {% for r in rows %}
  <li>{{ r.title }} — {{ r.url }}{% if r.pinned %} (pinned){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/bookmarks">
  <input name="title" />
  <input name="url" />
  <button type="submit">Add</button>
</form>
{% endblock %}
