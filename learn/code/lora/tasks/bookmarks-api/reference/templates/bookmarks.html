{% extends "base.html" %}
{% block content %}
<h1>Bookmarks</h1>
<ul>
  {% for b in bookmarks %}
  <li>{{ b.title }} — {{ b.url }}{% if b.pinned %} (pinned){% endif %}</li>
  {% endfor %}
</ul>
<form method="post" action="/bookmarks">
  <input name="title" placeholder="Title" />
  <input name="url" placeholder="https://..." />
  <button type="submit">Add</button>
</form>
{% endblock %}
