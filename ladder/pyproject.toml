[project]
name = "mellum-ladder"
version = "0.1.0"
description = "The ladder that measures mellum-worker: rungs 1-5 and the AgentClinic rungs 6-9"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "slow: syncs and runs a whole fixture workspace; runs by default, deselect with -m 'not slow'",
]
